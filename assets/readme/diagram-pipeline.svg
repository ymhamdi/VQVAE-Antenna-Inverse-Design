<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Inverse design pipeline</title>
  <desc id="d">A test spec (G, SSL, HPBW, theta0) goes into the conditional prior, which gives probabilities over 16 codes for each of the 5 rings. 300 code combinations are sampled, plus the most likely one: 301. The VQ-VAE decoder turns each into an array. Duplicates and the empty array are removed, leaving about 294 arrays. The teacher's array-factor code computes G, SSL and HPBW of each at the requested theta0, and criterion (25) keeps the array whose beam is closest to the spec.</desc>
  <rect x="0" y="0" width="960" height="396" rx="14" fill="#fcfcfb"/>
  <rect x="0.5" y="0.5" width="959" height="395" rx="14" fill="none" stroke="#d9d6cf"/>
  <text x="22" y="40" font-size="20" font-weight="700" fill="#0b0b0b">One spec in, one array out</text>
  <rect x="560" y="26" width="16" height="16" rx="3" fill="#fde9e0" stroke="#d9d6cf"/><text x="584" y="39" font-size="14" fill="#52514e">learned (VQ-VAE, prior)</text>
  <rect x="760" y="26" width="16" height="16" rx="3" fill="#efeeea" stroke="#d9d6cf"/><text x="784" y="39" font-size="14" fill="#52514e">physics (teacher's code)</text>
  <rect x="22" y="70" width="204" height="104" rx="10" fill="#fcfcfb" stroke="#d9d6cf" stroke-width="1.2"/>
  <text x="124.0" y="100" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Spec s*</text>
  <text x="124.0" y="124" font-size="14.5" fill="#52514e" text-anchor="middle">G*, SSL*, HPBW*, θ0*</text>
  <text x="124.0" y="144" font-size="14.5" fill="#52514e" text-anchor="middle">from the 100 test specs</text>
  <line x1="226" y1="122.0" x2="255" y2="122.0" stroke="#52514e" stroke-width="1.8"/>
  <path d="M262 122.0 l-9 -5 v10 z" fill="#52514e"/>
  <rect x="262" y="70" width="204" height="104" rx="10" fill="#fde9e0" stroke="#d9d6cf" stroke-width="1.2"/>
  <text x="364.0" y="100" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Conditional prior</text>
  <text x="364.0" y="124" font-size="14.5" fill="#52514e" text-anchor="middle">p(k | s*): 16 codes</text>
  <text x="364.0" y="144" font-size="14.5" fill="#52514e" text-anchor="middle">for each of the 5 rings</text>
  <line x1="466" y1="122.0" x2="495" y2="122.0" stroke="#52514e" stroke-width="1.8"/>
  <path d="M502 122.0 l-9 -5 v10 z" fill="#52514e"/>
  <rect x="502" y="70" width="204" height="104" rx="10" fill="#fde9e0" stroke="#d9d6cf" stroke-width="1.2"/>
  <text x="604.0" y="100" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">301 code combos</text>
  <text x="604.0" y="124" font-size="14.5" fill="#52514e" text-anchor="middle">300 samples</text>
  <text x="604.0" y="144" font-size="14.5" fill="#52514e" text-anchor="middle">+ the most likely one</text>
  <line x1="706" y1="122.0" x2="735" y2="122.0" stroke="#52514e" stroke-width="1.8"/>
  <path d="M742 122.0 l-9 -5 v10 z" fill="#52514e"/>
  <rect x="742" y="70" width="204" height="104" rx="10" fill="#fde9e0" stroke="#d9d6cf" stroke-width="1.2"/>
  <text x="844.0" y="100" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">VQ-VAE decoder</text>
  <text x="844.0" y="124" font-size="14.5" fill="#52514e" text-anchor="middle">codes → arrays</text>
  <text x="844.0" y="144" font-size="14.5" fill="#52514e" text-anchor="middle">argmax on each ring</text>
  <rect x="22" y="236" width="204" height="104" rx="10" fill="#fcfcfb" stroke="#d9d6cf" stroke-width="1.2"/>
  <text x="124.0" y="266" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">≈ 294 arrays</text>
  <text x="124.0" y="290" font-size="14.5" fill="#52514e" text-anchor="middle">duplicates and</text>
  <text x="124.0" y="310" font-size="14.5" fill="#52514e" text-anchor="middle">[0 0 0 0 0] removed</text>
  <line x1="226" y1="288.0" x2="255" y2="288.0" stroke="#52514e" stroke-width="1.8"/>
  <path d="M262 288.0 l-9 -5 v10 z" fill="#52514e"/>
  <rect x="262" y="236" width="204" height="104" rx="10" fill="#efeeea" stroke="#d9d6cf" stroke-width="1.2"/>
  <text x="364.0" y="266" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Array factor</text>
  <text x="364.0" y="290" font-size="14.5" fill="#52514e" text-anchor="middle">G, SSL, HPBW of each</text>
  <text x="364.0" y="310" font-size="14.5" fill="#52514e" text-anchor="middle">at the requested θ0*</text>
  <line x1="466" y1="288.0" x2="495" y2="288.0" stroke="#52514e" stroke-width="1.8"/>
  <path d="M502 288.0 l-9 -5 v10 z" fill="#52514e"/>
  <rect x="502" y="236" width="204" height="104" rx="10" fill="#efeeea" stroke="#d9d6cf" stroke-width="1.2"/>
  <text x="604.0" y="266" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Criterion (25)</text>
  <text x="604.0" y="290" font-size="14.5" fill="#52514e" text-anchor="middle">Σ |spec − spec*| / σ</text>
  <text x="604.0" y="310" font-size="14.5" fill="#52514e" text-anchor="middle">σ from the training set</text>
  <line x1="706" y1="288.0" x2="735" y2="288.0" stroke="#52514e" stroke-width="1.8"/>
  <path d="M742 288.0 l-9 -5 v10 z" fill="#52514e"/>
  <rect x="742" y="236" width="204" height="104" rx="10" fill="#e3eefb" stroke="#d9d6cf" stroke-width="1.2"/>
  <text x="844.0" y="266" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Chosen array n̂</text>
  <text x="844.0" y="290" font-size="14.5" fill="#52514e" text-anchor="middle">the closest beam</text>
  <text x="844.0" y="310" font-size="14.5" fill="#52514e" text-anchor="middle">5 integers, 0 to 10</text>
  <path d="M844.0 174 V205.0 H124.0 V229" fill="none" stroke="#52514e" stroke-width="1.8"/>
  <path d="M124.0 236 l-5 -9 h10 z" fill="#52514e"/>
  <text x="22" y="376" font-size="13.5" fill="#8a877f">Committed run: 294.2 unique arrays per spec on average (min 269, max 301), 29,424 array-factor evaluations for the 100 specs.</text>
</svg>
